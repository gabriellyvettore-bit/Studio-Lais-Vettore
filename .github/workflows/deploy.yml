name: Testes e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguranca-banco:
    name: Testes de segurança do banco (RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Aplicar migrações em banco de teste
        run: cat supabase/tests/00_local_supabase_shim.sql supabase/migrations/*.sql | psql -v ON_ERROR_STOP=1 -q
      - name: Rodar testes de RLS
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/rls_test.sql

  build:
    name: Build do site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
        env:
          # A anon key é pública por natureza (a proteção está no RLS).
          # Configure em Settings → Secrets and variables → Actions → Variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Garantir que nenhuma chave secreta foi parar no site
        run: |
          if grep -rIl "service_role" dist/ ; then echo "service_role encontrada no build!"; exit 1; fi
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [build, seguranca-banco]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
